<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameNow</title>
  <link rel="icon" type="image/png" href="/gamenow-logo.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/gamenow-logo.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="site-shell">
    <header class="site-header">
      <button class="brand-button" type="button" onclick="location.href='/'">
        <span class="brand-mark" aria-hidden="true">
          <img class="brand-logo-img" src="/gamenow-logo.png" alt="" width="40" height="48" decoding="async" />
        </span>
        <span class="brand-copy">
          <strong>GameNow</strong>
        </span>
      </button>
    </header>

    <main>
      <section id="view-home" class="view">
        <div class="home-hero">
          <div>
            <span class="eyebrow">Board Game List</span>
            <h1>Game Now With Friends</h1>
          </div>
        </div>

        <section class="game-list">
          <article class="game-card featured">
            <div class="game-copy">
              <span class="eyebrow">2-Player Match</span>
              <h2>Battleship</h2>
            </div>
            <div class="game-actions">
              <button onclick="location.href='/battleship.html'" type="button">Open Game</button>
              <button id="continue-battleship" class="ghost" type="button" style="display:none" onclick="continueBattleship()">Continue Last Room</button>
            </div>
          </article>

          <article class="game-card">
            <div class="game-copy">
              <span class="eyebrow">2–6 Players</span>
              <h2>UNO</h2>
            </div>
            <div class="game-actions">
              <button onclick="location.href='/uno.html'" type="button">Open Game</button>
              <button id="continue-uno" class="ghost" type="button" style="display:none" onclick="continueUno()">Continue Last Room</button>
            </div>
          </article>
          <article class="game-card">
            <div class="game-copy">
              <span class="eyebrow">2-Player Match</span>
              <h2>Chess</h2>
            </div>
            <div class="game-actions">
              <button onclick="location.href='/chess.html'" type="button">Open Game</button>
            </div>
          </article>
          <article class="game-card">
            <div class="game-copy">
              <span class="eyebrow">2-Player Match</span>
              <h2>Gomoku</h2>
            </div>
            <div class="game-actions">
              <button onclick="location.href='/gomoku.html'" type="button">Open Game</button>
            </div>
          </article>
        </section>
      </section>
    </main>
  </div>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <script>
    (function() {
      // Battleship
      const bs = (() => { try { return JSON.parse(localStorage.getItem("gamenowBattleshipSession")); } catch(_) { return null; } })();
      if (bs?.roomId) {
        const btn = document.getElementById("continue-battleship");
        if (btn) { btn.style.display = ""; btn.textContent = "Continue Room " + bs.roomId; }
      }
      // UNO
      const uno = (() => { try { return JSON.parse(localStorage.getItem("gamenowUnoSession")); } catch(_) { return null; } })();
      if (uno?.roomId) {
        const btn = document.getElementById("continue-uno");
        if (btn) { btn.style.display = ""; btn.textContent = "Continue Room " + uno.roomId; }
      }
    })();

    function continueBattleship() {
      const bs = JSON.parse(localStorage.getItem("gamenowBattleshipSession"));
      if (bs?.roomId) location.href = "/battleship/" + bs.roomId;
    }
    function continueUno() {
      const uno = JSON.parse(localStorage.getItem("gamenowUnoSession"));
      if (uno?.roomId) location.href = "/uno/" + uno.roomId;
    }
  </script>
</body>
</html>
